version: "3.9"

# Run all 4 with:  docker compose up -d
# Stop with:       docker compose down
# Wipe local data and start clean:  docker compose down -v

services:

  minio:
    image: minio/minio:latest
    container_name: argus-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: argus_admin
      MINIO_ROOT_PASSWORD: change_me_locally   # override via .env, never hardcode for real deployment
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16
    container_name: argus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: change_me_locally
      POSTGRES_DB: argus_fir
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql  # runs once, on first startup only

  qdrant:
    image: qdrant/qdrant:latest
    container_name: argus-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    container_name: argus-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/change_me_locally
    volumes:
      - neo4j_data:/data

volumes:
  minio_data:
  postgres_data:
  qdrant_data:
  neo4j_data:
