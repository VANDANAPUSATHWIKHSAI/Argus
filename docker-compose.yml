version: '3.9'

services:

  # ── PostgreSQL — structured data ──────────────────────────────
  # Stores: FIR findings, case sessions, audit logs, agent outputs,
  # confidence scores, chain-of-custody records
  postgres:
    image: postgres:16
    container_name: argus_postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus_user
      POSTGRES_PASSWORD: argus_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-loads schema on first container start (runs once only)
      - ./seed/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U argus_user -d argus']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO — raw evidence object storage ───────────────────────
  # Stores: original evidence files (immutable), encrypted raw artifacts,
  # memory dumps, PCAP files, disk images — anything large and binary.
  # Acts as the Original Evidence Repository (Layer 1).
  minio:
    image: minio/minio:latest
    container_name: argus_minio
    restart: unless-stopped
    ports:
      - '9000:9000'   # S3-compatible API
      - '9001:9001'   # MinIO Console (Web UI)
    environment:
      MINIO_ROOT_USER: argus_minio
      MINIO_ROOT_PASSWORD: argus_minio_dev
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j — graph database ────────────────────────────────────
  # Used by: Agent 2 (evidence correlation via GDS),
  #          Agent 3 (MITRE ATT&CK kill-chain graph traversal)
  neo4j:
    image: neo4j:5
    container_name: argus_neo4j
    restart: unless-stopped
    ports:
      - '7474:7474'   # Neo4j Browser (Web UI)
      - '7687:7687'   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/argus_dev
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data

  # ── Qdrant — vector database ──────────────────────────────────
  # Used by: Agent 5b (RAG against Validated Case Repository)
  # Per-tenant collections (NOT shared with tenant-ID filter)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: argus_qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'   # REST API
      - '6334:6334'   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ── ClamAV — malware scanning ─────────────────────────────
  clamav:
    image: clamav/clamav:latest
    container_name: argus_clamav
    restart: unless-stopped
    ports:
      - '3310:3310'

volumes:
  postgres_data:
  minio_data:
  neo4j_data:
  qdrant_data:

