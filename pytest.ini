[pytest]
pythonpath = .
testpaths =
    agents
    artifact_extraction
    canonical_schema
    evidence_consolidation
    fcr_engine
    forensic_analysis
    ingestion
norecursedirs = data repository external_tools logs scratch .git .pytest_cache
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:pydantic.*:
    ignore::DeprecationWarning:datetime.*:
